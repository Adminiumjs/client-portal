# DigitalOcean App Platform — bring your own database.
#
# ─── When to use this instead of `deploy.template.yaml` ─────────────────────
#
# The template beside this one declares a MANAGED DigitalOcean Postgres and
# wires it in with `${clients-db.DATABASE_URL}` — App Platform's own binding
# syntax, which it resolves at deploy time. That is the right default for a
# marketplace button: one click, nothing else to sign up for.
#
# This variant is for an operator who already HAS a database — Neon, Supabase,
# RDS, a droplet — and it is strictly simpler:
#
#   * no `databases:` component, so nothing to provision and nothing to pay for;
#   * no `${...}` binding, so the single most platform-specific expression in the
#     other file is absent entirely;
#   * the DSN arrives as a plain secret the operator pastes once.
#
# Everything else is identical, deliberately: same pre-deploy job, same image,
# same routes. Two specs that differ only in where the database comes from are
# reviewable; two that drift are not.
#
# ─── The job still runs, and still matters ──────────────────────────────────
#
# It is tempting to drop the migration job when the database already exists.
# Do not. It is idempotent and guarded — verified against a real Postgres,
# fresh and populated — and on an already-migrated database it prints
# "schema already present — NOT re-applying" and exits. That line is how you
# know the job ran at all, which is the thing worth knowing on a first deploy.
#
# ─── Verified against a real remote database ────────────────────────────────
#
# The whole stack was exercised against a managed Postgres 18.6 over TLS through
# a TRANSACTION POOLER before this file existed: `migrate.sh` end to end,
# Adminium introspecting 9 tables into 15 pages with no error hint, and the
# hosted staff surface rendering real rows behind the session gate. The pooler
# mattered — Adminium ships a remediation hint for exactly that topology and it
# did not fire.
#
# What remains unverified here is App Platform itself: that the PRE_DEPLOY job
# runs BEFORE the service, and that the service answers on 4600 with
# `/apps/clients/staff/` redirecting to /login rather than 404ing.
#
# NOTE the service builds Adminium FROM SOURCE (`Dockerfile.stack-src`). The
# published image predates hosted surfaces, so it cannot serve them; building
# the ref under test is what makes this deploy prove anything. Expect a slow
# first build — it compiles the server and the dashboard.
#
#   doctl apps create --spec .do/deploy.external-db.yaml
#
# It will prompt for the two secrets below.
spec:
  name: client-portal
  region: nyc

  jobs:
    - name: db-init
      kind: PRE_DEPLOY
      github:
        repo: Adminiumjs/client-portal
        branch: main
        deploy_on_push: true
      dockerfile_path: db/Dockerfile.migrate
      instance_size_slug: apps-s-1vcpu-0.5gb
      instance_count: 1
      envs:
        # Your database. A SECRET rather than a plain value because a DSN
        # carries a password — App Platform encrypts these at rest and never
        # shows them again after the first save.
        - key: DATABASE_URL
          scope: RUN_TIME
          type: SECRET
        # 1 loads sample rows into YOUR database, where you own them and
        # `npm run demo:wipe` removes them. Set 0 for an empty schema. Ignored
        # entirely once the database has rows — the job never overwrites data.
        - key: DEMO_DATA
          scope: RUN_TIME
          value: "1"

  services:
    - name: adminium
      github:
        repo: Adminiumjs/client-portal
        branch: main
        deploy_on_push: true
      # SOURCE BUILD, not the published tag — `ghcr.io/mosofi/adminium:latest`
      # is whatever the last `v*` tag published, and hosted surfaces are not in
      # it yet. Against that image this deploy would come up healthy and 404 on
      # /apps/clients/staff/, which reads as a routing bug and is a release-
      # ordering one. Switch to `Dockerfile.stack` once the feature ships in a
      # release; the two differ only in where Adminium comes from.
      dockerfile_path: Dockerfile.stack-src
      http_port: 4600
      instance_size_slug: apps-s-1vcpu-1gb
      instance_count: 1
      routes:
        - path: /
      health_check:
        http_path: /
      envs:
        # REQUIRED. `openssl rand -hex 32`. No value here on purpose: a default
        # secret is a shared secret, and every deploy would have the same one.
        - key: ADMINIUM_SECRET
          scope: RUN_TIME
          type: SECRET
        # The same DSN the job migrated. Adminium introspects it on first boot
        # and generates the back office from it; a connection deleted later is
        # not silently rebuilt.
        - key: ADMINIUM_SOURCE_URL
          scope: RUN_TIME
          type: SECRET
        # Safe ONLY because App Platform terminates TLS and proxies every
        # request, so the forwarded client address is one the platform wrote.
        # Reachable directly, this would let any caller forge their source IP
        # out of the audit log and out of every per-IP limit.
        - key: ADMINIUM_TRUST_PROXY
          scope: RUN_TIME
          value: "1"
