# DigitalOcean App Platform — the whole stack, not a static site.
#
# ─── What this replaced, and why ─────────────────────────────────────────────
#
# This file used to declare a single `static_sites` entry running `npm run
# build`. That is a complete description of the FRONT END and none of the
# product: no database, no Adminium, nothing for the screens to read. Built with
# no variables set, the app falls back to its bundled sample data, so pressing
# "Deploy to DigitalOcean" produced a convincing demo on the operator's own
# domain and own bill, with no path from there to a working app.
#
# Three components replace it, and each is load-bearing:
#
#   databases   a managed Postgres — the app's own data, which is the thing the
#               static-site version had nowhere to put.
#   jobs        a PRE_DEPLOY schema load. Compose gets this from Postgres's
#               `docker-entrypoint-initdb.d`; a managed database has no such
#               hook, so without this Adminium introspects an empty database and
#               generates nothing.
#   services    Adminium with the app's screens baked in (`Dockerfile.stack`),
#               serving both at its own origin. Hosting them here rather than as
#               a separate static site is what removes the chicken-and-egg: a
#               publishable key can only be minted from inside a running
#               Adminium, so a first deploy can never have one.
#
# ─── UNVERIFIED — read before trusting it ────────────────────────────────────
#
# Written against DigitalOcean's documented App Spec. Two of the original four
# unknowns have since been CLOSED locally; two still need a real deploy.
#
# CLOSED 2026-08-23:
#   ✅ `ghcr.io/mosofi/adminium:latest` is publicly pullable anonymously and
#      publishes linux/amd64 — no registry credential is needed here.
#   ✅ `migrate.sh` runs end to end against a real Postgres: fresh database,
#      redeploy over live data, and DEMO_DATA=0. Running it is what exposed the
#      destructive bug this spec would otherwise have shipped (see the job).
#
# STILL UNVERIFIED — check in order on the first deploy:
#   1. the `${clients-db.DATABASE_URL}` binding resolves in both the job and the
#      service (the piece most likely to differ from the docs);
#   2. the PRE_DEPLOY job runs BEFORE the service and its logs show
#      "migrate: done";
#   3. the service answers on 4600 and `/apps/clients/staff/` redirects to
#      /login rather than 404ing.
# If any of those fail, the fix belongs here — do not fall back to the static
# site, which is what produced the demo.
spec:
  name: client-portal
  region: nyc

  databases:
    - name: clients-db
      engine: PG
      version: "16"
      # The smallest thing that works, so the button is cheap to press. An
      # operator who keeps it will want `production: true` and a size.
      production: false

  jobs:
    - name: db-init
      kind: PRE_DEPLOY
      github:
        repo: Adminiumjs/client-portal
        branch: main
        deploy_on_push: true
      dockerfile_path: db/Dockerfile.migrate
      instance_size_slug: apps-s-1vcpu-0.5gb
      instance_count: 1
      envs:
        - key: DATABASE_URL
          scope: RUN_TIME
          value: ${clients-db.DATABASE_URL}
        # 1 loads sample rows into YOUR database, where you own them and
        # `npm run demo:wipe` removes them. Set 0 for an empty schema. This is
        # not the bundled demo the old template shipped: those rows lived in the
        # JavaScript and could never be edited, exported or deleted.
        - key: DEMO_DATA
          scope: RUN_TIME
          value: "1"

  services:
    - name: adminium
      github:
        repo: Adminiumjs/client-portal
        branch: main
        deploy_on_push: true
      dockerfile_path: Dockerfile.stack
      http_port: 4600
      instance_size_slug: apps-s-1vcpu-1gb
      instance_count: 1
      routes:
        - path: /
      health_check:
        http_path: /
      envs:
        # REQUIRED. Generate with `openssl rand -hex 32`. App Platform prompts
        # for it because it has no value here — which is deliberate: a default
        # secret is a shared secret, and every deploy would have the same one.
        - key: ADMINIUM_SECRET
          scope: RUN_TIME
          type: SECRET
        # The database the back office is generated FROM. Seeded on first boot
        # only: a connection deleted later is not silently rebuilt.
        - key: ADMINIUM_SOURCE_URL
          scope: RUN_TIME
          value: ${clients-db.DATABASE_URL}
        # Safe ONLY because App Platform terminates TLS and proxies every
        # request, so the forwarded client address is one the platform wrote.
        # Reachable directly, this would let any caller forge their source IP
        # out of the audit log and out of every per-IP limit.
        - key: ADMINIUM_TRUST_PROXY
          scope: RUN_TIME
          value: "1"
