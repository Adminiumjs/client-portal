# SPDX-License-Identifier: AGPL-3.0-only
#
# VENDORED. The canonical copy is `workplan/tools/app-release/release.yml` in the
# Adminium monorepo; `app-release.sh sync` copies it into every app repo. Edit it
# there, never here.
#
# WHERE A RELEASE GOES (48-self-hosted-downloads.md D1/D6). The packed file is
# uploaded to the Adminiumjs downloads bucket, read back from
# https://downloads.adminium.dev, and only then recorded in RELEASES.json. Apps
# are not published to npm.
#
# DISPATCH-TRIGGERED, NOT TAG-TRIGGERED, and for the same reason the add-ons
# release is: the ledger wants `{name, version, integrity}` computed from the
# file that was actually released, committed, and INSIDE the tag. A
# tag-triggered run cannot commit into the tag that started it. So this job
# uploads, writes the ledger, commits it, and cuts the tag last — and restates
# the guards `on: push: tags` would have given for free.
#
# BEFORE THE FIRST RUN: this repository must be granted the Adminiumjs
# organization's variables R2_ACCOUNT_ID + R2_BUCKET and secrets
# R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY (48 §3 gate 1.7). The secret key is
# an Object Read & Write token scoped to the bucket: it can add a version and
# can never replace or delete one (D2).

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.1.1). Must already be in manifest.json.'
        required: true
        type: string
      allow_version_jump:
        description: 'Allow a major/minor bump. Leave OFF — releases are patch-only by owner policy.'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commit the ledger, push the tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Refuse anything but main, and any tag that already exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semver version"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists — released files are immutable, pick a new version"; exit 1
          fi
          echo "Releasing $VERSION from $(git rev-parse --short HEAD)"

      # Before anything is built: a repo that was never granted the bucket
      # credentials should find out in seconds, not after a build.
      - name: Refuse to start without the bucket credentials
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          HAS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$R2_ACCOUNT_ID" ] || missing+=('variable R2_ACCOUNT_ID')
          [ -n "$R2_BUCKET" ] || missing+=('variable R2_BUCKET')
          [ "$HAS_KEY_ID" = true ] || missing+=('secret R2_ACCESS_KEY_ID')
          [ "$HAS_SECRET" = true ] || missing+=('secret R2_SECRET_ACCESS_KEY')
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::not granted to this repository: ${missing[*]} (Adminiumjs organization settings)"; exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The manifest on disk is what ships: publish-app.mjs reads its own
      # version and never looks at this input. Assert they agree BEFORE anything
      # is uploaded — the bucket has no undo.
      - name: Assert the manifest is at the requested version
        env:
          VERSION: ${{ inputs.version }}
          ALLOW_JUMP: ${{ inputs.allow_version_jump }}
        run: |
          set -euo pipefail
          node -e '
            const { readFileSync } = require("fs");
            const want = process.env.VERSION;
            const man = JSON.parse(readFileSync("manifest.json", "utf8"));
            if (man.version !== want) {
              console.error(`::error::manifest.json is ${man.version}, expected ${want}`);
              process.exit(1);
            }
            console.log(`${man.key} at ${want}`);

            // PATCH-ONLY (owner policy, 2026-09-12): every release is a patch —
            // 0.1.0 -> 0.1.1 -> 0.1.2 — and major/minor never move until the
            // owner says so. Enforced here rather than written down because a
            // released file is IMMUTABLE: the bucket lock keeps a mistaken
            // `1.0.0` forever, and its number can never be used again.
            //
            // Compared against the release ledger, which is the record of what
            // was actually released, not against tags (deletable) or the bucket
            // (a network call this step should not need).
            const prior = (() => {
              try {
                const l = JSON.parse(readFileSync("RELEASES.json", "utf8"));
                return (l.releases ?? [])
                  .map((r) => r.version)
                  .sort((a, b) => {
                    const A = a.split(/[.-]/).map(Number);
                    const B = b.split(/[.-]/).map(Number);
                    return A[0] - B[0] || A[1] - B[1] || A[2] - B[2];
                  })
                  .pop();
              } catch {
                return undefined;   // first release — nothing to compare
              }
            })();

            if (prior !== undefined && process.env.ALLOW_JUMP !== "true") {
              const [pMaj, pMin, pPat] = prior.split(/[.-]/).map(Number);
              const [wMaj, wMin, wPat] = want.split(/[.-]/).map(Number);
              if (wMaj !== pMaj || wMin !== pMin) {
                console.error(
                  `::error::${want} is a major/minor bump from ${prior}. Releases are ` +
                    `patch-only: the next one is ${pMaj}.${pMin}.${pPat + 1}. To bump ` +
                    `deliberately, re-run with allow_version_jump enabled.`,
                );
                process.exit(1);
              }
              if (wPat <= pPat) {
                console.error(`::error::${want} does not advance on ${prior}`);
                process.exit(1);
              }
            }
          '

      - name: Build the surfaces
        run: npm run build:surface

      # Pack + X-ray before uploading anything. A released version is
      # immutable, so a defect found after the upload is in the bucket forever.
      - name: Pack and X-ray the tarball
        run: node scripts/publish-app.mjs --dry-run

      # The only step that sees the bucket credentials. It uploads, then reads
      # the file back from downloads.adminium.dev, and writes the ledger row
      # only once the served bytes hash to this build. Re-dispatching the same
      # version after a failure here is safe: identical bytes already in the
      # bucket are accepted, different ones are refused.
      - name: Upload, read back, and write the release ledger
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/publish-app.mjs

      # The ledger is what the marketplace catalog carries to every server, so
      # it has to be readable at a pinned SHA rather than left as a build artifact.
      - name: Commit the ledger and cut the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'Mohamed Sofi'
          git config user.email 'designsuniverse@gmail.com'
          git add RELEASES.json
          if git diff --cached --quiet; then
            echo "::error::RELEASES.json did not change — the upload step wrote no ledger"; exit 1
          fi
          git commit -m "chore(release): ledger for v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
